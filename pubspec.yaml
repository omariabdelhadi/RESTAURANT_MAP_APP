name: restaurant_map_app
description: "A Flutter web application for managing restaurants with interactive maps."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  sembast: ^3.8.5+1
  sembast_web: ^2.4.2
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  provider: ^6.1.1
  dio: ^5.4.0
  image_picker: ^1.0.7
  uuid: ^4.3.3
  http: ^1.2.0
  flutter_map_marker_popup: ^6.1.2
  tuple: ^2.0.2
  cached_network_image: ^3.3.1
  sqflite: ^2.3.2
  flutter_image_compress: ^2.1.0
  lottie: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/map_Rest.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/map_Rest.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
